# 27 actuated hinge joints, from PLAN.md §3.2.
# The table's one-sided entries ("*") are expanded to _L and _R.
# axis: rotation axis vector in the body frame (x = fore-aft/forward is +x,
# y = lateral/left is +y, z = up). Chosen so that the positive side of the
# range is the anatomically positive direction; right-side abduction and
# internal/external rotation axes are mirrored.
# range_deg: [lo, hi] joint limit in degrees (converted to radians in XML).
# torque: actuator gear in N·m (ctrl is normalized to [-1, 1]).
# group: brain-side grouping — left (11), center (5), right (11).
# parent_body: the <body> element that declares this joint (child side of the link).
joints:
  - {name: waist_z,       axis: [0, 0, 1],  range_deg: [-40, 40],  torque: 60,  group: center, parent_body: torso}
  - {name: waist_y,       axis: [1, 0, 0],  range_deg: [-30, 30],  torque: 80,  group: center, parent_body: torso}
  - {name: waist_x,       axis: [0, -1, 0], range_deg: [-60, 30],  torque: 100, group: center, parent_body: torso}
  - {name: neck_y,        axis: [1, 0, 0],  range_deg: [-45, 45],  torque: 15,  group: center, parent_body: head}
  - {name: neck_z,        axis: [0, 0, 1],  range_deg: [-60, 60],  torque: 15,  group: center, parent_body: head}
  - {name: shoulder_L_x,  axis: [0, -1, 0], range_deg: [-60, 170], torque: 40,  group: left,   parent_body: upper_arm_L}
