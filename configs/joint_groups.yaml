  - {name: elbow_L,       axis: [0, -1, 0], range_deg: [0, 150],   torque: 30,  group: left,   parent_body: forearm_L}
  - {name: wrist_L,       axis: [0, -1, 0], range_deg: [-70, 70],  torque: 8,   group: left,   parent_body: hand_L}
  - {name: hip_L_x,       axis: [0, -1, 0], range_deg: [-30, 120], torque: 120, group: left,   parent_body: thigh_L}
